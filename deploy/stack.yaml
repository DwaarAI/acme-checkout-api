AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Acme Checkout API on ECS Fargate (Dwaar demo). One arm64 task with a public IP in a public subnet.
  DEMO: misconfigured on purpose for posture and IaC scanners: the security group is open to the
  internet, logs are unencrypted and kept forever, Container Insights is off. Never put a real workload here.
Parameters:
  ImageUri:
    Type: String
    Description: The image to run, by digest (repository@sha256:...).
  ClusterName: { Type: String, Default: acme-checkout }
  VpcId: { Type: AWS::EC2::VPC::Id }
  SubnetIds: { Type: "List<AWS::EC2::Subnet::Id>" }
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /acme-checkout/api }
  ServiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: acme-checkout-api
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 0.0.0.0/0, Description: storefront and anyone else }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0, Description: debugging }
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: acme-checkout-api-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: acme-checkout-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - { Name: ACME_ENV, Value: demo }
            - { Name: ACME_PAYMENTS_ENDPOINT, Value: "https://payments.invalid" }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: api }
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: acme-checkout-api
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSg]
Outputs:
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
